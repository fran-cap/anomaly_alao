category=
version=1.0
comments=ALAO spawn prewarm (I-064). The first fresh stalker the simulation creates in a session makes the engine load all ~5300 character descriptions cold in one ~440 ms frame (it walks the whole list to pick a random one). This mod creates one throwaway sim_default stalker at actor_on_first_update, behind the loading screen, pins it offline and releases it through safe_release_manager, so that load happens where nobody sees it. Adds one script (zzz_alao_spawn_prewarm.script), replaces and wraps nothing, registers no per-frame callback, stores nothing in the save. Safe to disable or delete at any time.
