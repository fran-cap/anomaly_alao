version=1.0
comments=ALAO stealth MCM cache (I-066). Stealth Overhaul's visual_memory_manager.get_visible_value is called by the engine once per NPC visibility evaluation and re-reads 7-8 MCM options through an uncached ini each time (14-16 engine calls). This caches stealth_mcm.get_config and drops the cache on on_option_change / ui_mcm.set("stealth/..."). Adds one script (zzz_alao_vmm_cache.script), replaces no game file, return values bit-identical. Safe to disable or delete at any time; no save-game effect.
