version=1.0
comments=ALAO squad first-update stagger (I-065). Every squad's first update after a load is the expensive one (target search, 2-5 ms each, 523 squads). The engine either runs them all behind the loading screen or, in about four loads out of ten, dribbles them out at ~20 per ALife tick for the first ~25 s of play: 25 frames of 12-40 ms. This mod runs the pending first updates at actor_on_first_update, behind the loading screen, in id order, so every load behaves like the good ones; a per-frame-budgeted in-play drain is the fallback. Adds one script (zzz_alao_squad_stagger.script), replaces no game file, patches no function, saves nothing. Safe to disable or delete at any time.
