comments=ALAO prewarm bundle (I-063). Moves player-visible cold costs into the loading screen: the inventory's actor_bag cell pool, the PDA encyclopedia tab, the engine sound resources for the jump / land / footstep scripts, and the engine tutorial sequencer (which costs one 700 ms frame the first time you walk near a campfire). All of it at actor_on_first_update; registers no per-frame callback. Adds two scripts (zzz_alao_prewarm.script and a DXML module that appends one no-op tutorial node), replaces no game file. Safe to disable or delete at any time; no save-game effect.
