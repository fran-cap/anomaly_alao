comments=ALAO prewarm bundle (I-063). Builds the three lazy singletons that cost the player a visible hitch on first use - ui_inventory.GUI, the PDA encyclopedia tab, and the engine's sound resources for the jump / land / footstep scripts - synchronously at actor_on_first_update, while the loading screen is still up. Registers no per-frame callback. Adds one script (zzz_alao_prewarm.script), replaces no game file. Safe to disable or delete at any time; no save-game effect.
